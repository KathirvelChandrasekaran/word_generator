name: Publish to pub.dev

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze lib test --fatal-infos

      - name: Run tests
        run: dart test

      - name: Check publish warnings
        run: dart pub publish --dry-run

      - name: Confirm version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            printf '::error::Tag version %s does not match pubspec.yaml version %s\n' "$TAG_VERSION" "$PACKAGE_VERSION"
            exit 1
          fi
          printf 'Publishing version %s\n' "$PACKAGE_VERSION"

      - name: Publish to pub.dev
        run: dart pub publish --force
